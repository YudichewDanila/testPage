<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <title>VPN App</title>
    <style>
        :root {
            --maxVh: 100;
            --container: 640px;
            --bg-body: #ffffff;
            --bg-header: hsl(0, 0%, 100%);
            --header_pt: 1rem;
            --header_pb: 2rem;
            --header_justify_content: space-between;
            --header_align_items: flex-start;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            font-size: 10px;
        }

        body {
            font-family: "Inter", sans-serif;
            background: var(--bg-body);
            display: flex;
            flex-direction: column;
            height: calc(var(--vh, 1vh) * var(--maxVh));
            left: 0px;
            overflow: hidden;
            padding: 0 0 env(safe-area-inset-bottom, 0);
            -webkit-text-size-adjust: 100%;
            line-height: 1.3; 
        }

        header {
            background: var(--bg-header);
            padding-bottom: var(--header_pb);
            padding-top: var(--header_pt);
            z-index: 11;
        }

        .headerWrapper {
            align-items: var(--header_align_items);
            display: flex;
            justify-content: var(--header_justify_content);
        }

        .logo {
            width: 7rem;
            height: 7rem;
        }

        .rightPanel {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .lang-switch {
            display: flex;
            background: #eeeeee;
            border-radius: 1.5rem;
            padding: 4px;
            gap: 4px;
            width: fit-content;
        }

        .lang-option {
            padding: 0.5rem 1rem;
            font-size: 1.6rem;
            font-weight: 400;
            font-family: sans-serif;
            color: #b4b4b4;
            background: #eeeeee;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.1s;
        }

        .lang-option.active {
            background: white;
            color: black;
        }

        .containers {
            margin-left: auto;
            margin-right: auto;
            max-width: var(--container);
            padding-left: 2rem;
            padding-right: 2rem;
            width: 100%;
        }

        .main {
            height: 60%;
            width: 100%;
            position: relative;
        }

        .mainWrapper {
            display: block;
            width: 100%;
            height: 100%;
        }

        .content-wrapper {
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            gap: 0px;
            justify-content: flex-start;
            margin: 0 auto;
            max-width: var(--container);
            padding: 0rem;
        }

        .back-title {
            font-size: 3.3rem;
            color: rgb(0, 0, 0);
            font-weight: 600;
            margin-bottom: 1rem;
            line-height: 1; 
        }

        .back-description {
            font-size: 1.4rem;
            color: #6d6d6d;
            font-weight: 400;
            margin-bottom: 2rem;
        }

        .back-text {
            color: #434343;
            font-size: 2.5rem;
            font-weight: 600;
        }

        .back-steps {
            margin-top: 2rem;
            margin-bottom: 2rem;
            color: #474747;
        }

        .steps {
            display: flex;
            flex-direction: column;
        }

        .step {
            display: flex;
            margin-bottom: 1rem;
        }

        .step-logo {
            width: 2.5rem;
            height: 2.5rem;
            margin-right: 1rem;
        }

        .step-title {
            font-size: 2rem;
            font-weight: 600;
            color: #434343;
        }

        .step-description {
            font-size: 1.2rem;
            font-weight: 300;
            color: #6d6d6d;
        }

        @media (max-height: 600px) {
            :root {
                font-size: 10px;
            }
        }

        @media (min-height: 800px){
            .main{
                height: 70%;
            }
        }

        @media (min-width: 380px) and (min-height: 750px) {
            :root {
                font-size: 11px;
            }
        }

        @media (min-width: 410px) and (min-height: 750px) {
            :root {
                font-size: 12px;
            }
        }

        @media (min-width: 640px) {
            :root {
                font-size: 13px;
            }

            .containers {
                padding-left: 3rem;
                padding-right: 2rem;
            }
        }

        @media (min-width: 640px) and (max-height: 700px) {
            :root {
                font-size: 11px;
            }
        }

        @media (min-width: 640px) and (max-height: 600px) {
            :root {
                font-size: 10px;
            }
        }

        @media (max-width: 370px) {
            :root {
                font-size: 8px;
            }
        }

        @media (max-height: 550px) {
            :root {
                font-size: 7px;
            }
            
            header{
                padding-bottom: 0rem;
                padding-top: 0rem;
            }
        }

        @media (max-height: 450px) {
            :root {
                font-size: 5px;
            }

            .content-wrapper{
                justify-content: center;
                align-items: center;
            }

            .back-title{
                font-size: 3rem;
            }

            .back-description{
                display: none;
            }
        }

        @media (max-width: 350px) and (min-height: 700px) {

        }

        @media (max-width: 300px) {
            :root {
                font-size: 6px;
            }
        }

        @media (max-height: 300px) {
            :root {
                font-size: 4.5px;
            }
        }

        @media (max-height: 200px) {
            :root {
                font-size: 2vh;
            }
        }

        .footer-link {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .footer-link a {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 7rem;
            color: #ffffff;
            border-radius: 30rem;
            background: #2a2a2a;
            font-size: 2rem;
            font-weight: 400;
            text-decoration: none;
            margin-bottom: 1rem;
        }

        .footer-text{
            font-size: 1rem;
            color: #909090;
            text-align: center;
        }

        .footer-text p{
        margin-bottom: 1rem;
        }

        @media (min-height: 1000px) {
            .main{
                height: 80%;
            }
        }

        @media (min-width: 640px) and (min-height: 1000px) {
            :root{
                font-size: 16px;
            }
        }
    </style>
</head>

                title_vpn: "Похоже,<br> вы используте VPN",
                description: "С ним зайти не получиться из-за <br> действующих ограничений.",
                what_to_do: "Вот что можно сделать:",
                step1_title: "Отключить VPN",
                step1_desc: "Если он работает у вас на устройстве.",
                step2_title: "Выбрать другую сеть WI-FI",
                step2_desc: "Если VPN настроен на роутере.",
                retry_btn: "Попробовать ещё раз",
                footer_request: "ID запроса:",
                footer_ip: "IP-адрес:"
            },
            en: {
                title_vpn: "Looks like<br>you're using a VPN",
                description: "You won't be able to log in due to<br>current restrictions.",
                what_to_do: "Here's what you can do:",
                step1_title: "Turn off VPN",
                step1_desc: "If it's running on your device.",
                step2_title: "Choose a different Wi-Fi network",
                step2_desc: "If VPN is configured on your router.",
                retry_btn: "Try again",
                footer_request: "Request ID:",
                footer_ip: "IP address:"
            }
        };

        const useInnerHTML = ['title_vpn', 'description'];
    
        let currentLang = 'ru';
    
        function setLang(lang) {
        currentLang = lang;
        
        document.querySelectorAll('.lang-option').forEach(btn => {
            btn.classList.remove('active');
            const onclickAttr = btn.getAttribute('onclick');
            if (onclickAttr && onclickAttr.includes(`'${lang}'`)) {
                btn.classList.add('active');
            }
        });
        
        
        document.querySelectorAll('[data-i18n]').forEach(element => {
            const key = element.getAttribute('data-i18n');
            if (translations[lang][key]) {
                if (useInnerHTML.includes(key)) {
                    
                    element.innerHTML = translations[lang][key];
                } else {
                   
                    element.textContent = translations[lang][key];
                }
            }
        });
    }

    
        document.addEventListener('DOMContentLoaded', () => {
            setLang('ru');
        });
    </script>
    

</body>
</html>
