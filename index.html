<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мобильный киоск</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap");

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: linear-gradient(180deg, #010703 0%, #0d3f15 100%);
}

body {
  display: flex;
  justify-content: center;
  font-family: "Roboto", sans-serif;
  line-height: 1.5;
  color: #fff;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.page {
  --s: min(1vw, 1vh, 6.4px);
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  max-width: 640px;
  overflow: hidden;
  padding: 1% 0;
  align-items: center;
}

@media (orientation: landscape) {
  .page {
    --s: min(1vw, 1vh, 9.6px);
    max-width: 960px;
  }
}


.page__content {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1 1 0;
  min-height: 0;
  overflow: hidden;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  padding: 1% 2%;
  max-width: 640px;
  width: 100%;
}

.header__logo {
  display: block;
  height: calc(5 * var(--s));
  width: auto;
  max-width: 40%;
  object-fit: contain;
}

.header__age {
  font-size: calc(3.5 * var(--s));
  font-weight: 400;
  line-height: 1;
}

.kiosk {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 0 0 auto;
  padding-top: 1%;
  text-align: center;
}

.kiosk__icon {
  display: block;
  height: auto;
  width: calc(11.25 * var(--s));
  max-height: calc(12 * var(--s));
  object-fit: contain;
  margin-bottom: calc(1.5 * var(--s));
}

.kiosk__title {
  font-size: calc(5.6 * var(--s));
  font-weight: 700;
  line-height: 1.15;
  text-transform: uppercase;
}

.kiosk__subtitle {
  margin-top: calc(1.25 * var(--s));
  font-size: calc(3.5 * var(--s));
  font-weight: 300;
  line-height: 1.3;
  text-transform: uppercase;
}

.magazines {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1 1 0;
  min-height: 0;
  max-height: max-content;
  width: 100%;
}

.magazines__img {
  display: block;
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  transform: translateY(5%);
}

.cta {
  position: relative;
  z-index: 4;
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 0 0 auto;
  width: 100%;
  margin: 0;
  padding: 0 2%;
}

.cta__btn {
  width: 100%;
  height: calc(15 * var(--s));
  font-size: calc(6 * var(--s));
  font-family: inherit;
  font-weight: 700;
  line-height: 1;
  color: #fff;
  text-transform: uppercase;
  background: #26b83b;
  border: none;
  cursor: pointer;
  max-width: 640px;
}

.cta__price {
  margin-top: calc(1.5 * var(--s));
  font-size: calc(3.5 * var(--s));
  font-weight: 400;
  line-height: 1;
  text-transform: uppercase;
}

.cta__cancel {
  margin-top: calc(1.2 * var(--s));
  font-size: calc(2.5 * var(--s));
  font-weight: 400;
  line-height: 1;
  color: inherit;
  text-decoration: underline;
  opacity: 0.8;
}

.footer {
  flex-shrink: 0;
  padding: calc(2 * var(--s)) calc(3.75 * var(--s)) calc(0.6 * var(--s));
}

.footer__text {
  font-size: calc(1.875 * var(--s));
  font-weight: 300;
  line-height: 1.5;
  text-align: center;
}

.footer__link {
  color: inherit;
  text-decoration: underline;
}


@media (orientation: landscape) and  (min-aspect-ratio: 1.5/1) and (max-height: 479px)   {
  .magazines {
    display: none;
  }
  .cta {
    margin-top: calc(6.2 * var(--s));;
  } 
} 

@media (min-width: 960px) {
  .kiosk__icon {
    width: calc(6.5 * var(--s));
    max-height: calc(8 * var(--s));
  }

  .kiosk__title {
    font-size: calc(3.2 * var(--s));
  }

  .kiosk__subtitle {
    font-size: calc(2.2 * var(--s));
  }
  .cta__btn {
    height: calc(11 * var(--s));
    font-size: calc(4.5 * var(--s));
  }
}


/* Animation */
/* .page {
  --s: min(1vw, 1vh, 6.4px);
  transition: --s 0.4s ease;
}
@media (orientation: landscape) {
  .page {
    --s: min(1vw, 1vh, 9.6px);
  }
}
.cta__btn {
  transition: height 0.4s ease, font-size 0.4s ease;
} */
    </style>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img class="header__logo" src="images/logo-megafon.png" alt="Мегафон">
        <span class="header__age">16+</span>
      </header>


      <div class="page__content">
        <section class="kiosk">
          <img class="kiosk__icon" src="images/logo-kiosk.png" alt="">
          <h1 class="kiosk__title">Мобильный киоск</h1>
          <p class="kiosk__subtitle">Лучшие журналы в одном клике</p>
        </section>
  
        <section class="magazines">
          <img class="magazines__img" src="images/magazines.png" alt="">
        </section>
  
        <section class="cta">
          <button class="cta__btn" type="button">Читать</button>
          <p class="cta__price">50₽ в день</p>
          <a class="cta__cancel" href="#">Отмена</a>
        </section>
      </div> 
      
      <footer class="footer">
        <p class="footer__text">
          Списание со счета мобильного телефона. Нажимая на кнопку «Читать», вы соглашаетесь с <br>
          <a class="footer__link" href="#">условиями сервиса «Мобильный Киоск»</a>
        </p>
      </footer>

    </div>
  </body>
</html>
