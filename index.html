      rel="stylesheet"

    <title>МОБИЛЬНЫЙ КИОСК</title>
    <style>
      :root {
        font-size: 10px;
        font-size: clamp(6px, 3vmin, 16px);
        --container: 640px;
        --bgColor: linear-gradient(90deg, #010703, #109b10);
        --logoMega-size: 10rem;
        --logoText-size: 1.6rem;
        /* --logoMega-color: #25c04b; */
        --logoMega-color: white;
        --btnWrapper-size: 10px;
        --footerWrapper-size: 0.9rem;
      }

      * {
        margin: 0;
        padding: 0;
        -webkit-box-sizing: border-box;
        box-sizing: border-box;
        font-family: Roboto, sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: calc(var(--vh, 1vh) * 100);  
        /* height: 100dvh; */
        position: fixed;
        overflow: hidden; 
      }

      .bg {
        width: 100%;
        height: 100%;
        position: fixed;
        top: 0;
        left: 0;
        background: var(--bgColor);
        z-index: -1;
      }

      .header {
        width: 100%;
        padding-top: 1rem;
        padding-bottom: 1rem;
      }

      .headerWrapper {
        display: flex;
        justify-content: space-between;
        align-items: center;
        /* align-items: baseline;  */
      }

      .container {
        width: 100%;
        max-width: var(--container);
        margin-left: auto;
        margin-right: auto;
        padding-left: 1rem;
        padding-right: 1rem;
      }

      .logoMega {
        width: var(--logoMega-size);
      }

      .logoMega svg path,
      .logoMega svg polygon {
        fill: var(--logoMega-color);
      }

      .logoText {
        font-size: var(--logoText-size);
        font-family: Roboto, sans-serif;
        color: white;
        font-weight: 400;
        /* transform: translateY(-0.2rem);  */
      }

      .logoAge {
        font-size: var(--logoText-size);
        font-family: Roboto, sans-serif;
        color: white;
        font-weight: 500;
        /* transform: translateY(-0.2rem);  */
      }

      .main {
        width: 100%;
        flex: 1;
        min-height: 0;
        margin-bottom: auto;
      }

      .mainWrapper {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
      }

      .btnWrapper {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        max-width: 50em;
        font-size: var(--btnWrapper-size);
      }

      .btn {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        /* height: 30em; */
        height: 17rem;
        background-color: white;
        border-radius: 50px;
        text-decoration: none;
      }

      .btn span {
        display: flex;
        align-items: center;
        font-size: 3rem;
        cursor: pointer;
        font-weight: 700;
        color: black;
      }

      .btn span svg {
        width: 2.5rem;
        margin-left: 1rem;
      }

      .price {
        font-size: 1.2rem;
        color: white;
        text-align: center;
        padding-top: 1rem;
        padding-bottom: 1rem;
        margin-bottom: 2rem;
        text-transform: uppercase;
      }

      .cancelWrapper {
        font-size: 1rem;
      }

      .cancel {
        font-size: 1rem;
        padding: 0.8rem 2rem;
        background-color: #f1efef00;
        border: 1px solid #ffffff;
        color: #ffffff;
        border-radius: 5px;
        text-decoration: none;
      }



      .footer {
        width: 100%;
        padding-bottom: 1rem;
        font-size: var(--footerWrapper-size);
      }

      .footerWrapper {
        color: white;
        text-align: center;
      }
      .footerWrapper span a {
        color: white;
        cursor: pointer;
      }

      @media (max-height: 300px) {
        :root {
          font-size: 3vh;
        }
      }
      @media (max-width: 310px) {
        :root {
          font-size: 3vw;
        }
      }
    </style>
  </head>

  <script>
    let vh = window.innerHeight * 0.01;
    document.documentElement.style.setProperty("--vh", `${vh}px`);

    window.addEventListener(
      "orientationchange",
      function () {
        let vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty("--vh", `${vh}px`);
      },
      false
    );
    window.addEventListener("resize", () => {
      let vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty("--vh", `${vh}px`);
    });
  </script>
