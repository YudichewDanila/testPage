<!DOCTYPE html>
<html lang="ru"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&amp;family=Roboto:ital,wght@0,100..900;1,100..900&amp;display=swap" rel="stylesheet">
    <title>Megafon Киоск</title>
    <style>
      :root {
        font-size: 9px;
        font-size: clamp(6px, 3vmin, 14px);  
        --container: 640px;
        --bgColor: #0d0d0d;
        --logoMega-size: 11rem;
        --logoText-size: 1.65rem;
        /* --logoMega-color: #25c04b; */
        --logoMega-color: #949494;
        --btnWrapper-size: 10px;
        --footerWrapper-size: 1rem;
      }

      * {
        margin: 0;
        padding: 0;
        -webkit-box-sizing: border-box;
        box-sizing: border-box;
      }

      body {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: calc(var(--vh, 1vh) * 100);
        height: 100dvh;
        position: fixed;
        overflow: hidden;
      }

      .bg {
        width: 100%;
        height: 100%;
        position: fixed;
        top: 0;
        left: 0;
        background: var(--bgColor);
        z-index: -1;
      }

      .header {
        width: 100%;
        padding-top: 1rem;
        padding-bottom: 1rem;
      }

      .headerWrapper {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }

      .container {
        width: 100%;
        max-width: var(--container);
        margin-left: auto;
        margin-right: auto;
        padding-left: 1rem;
        padding-right: 1rem;
      }

      .logoMega {
        width: var(--logoMega-size);
      }

      .logoMega svg path,
      .logoMega svg polygon {
        fill: var(--logoMega-color);
      }

      .logoText {
        font-size: var(--logoText-size);
        font-family: "Roboto", sans-serif;
        color: #949494;
        font-weight: 600;
      }

      .logoAge {
        font-size: var(--logoText-size);
        font-family: "Roboto", sans-serif;
        color: #949494;
        font-weight: 500;
      }

      .main {
        width: 100%;
        flex: 1;
        min-height: 0;
        margin-bottom: auto;
      }

      .mainText {
        font-size: 1.4rem;
        color: #949494;
        margin-bottom: 1.5rem;
        font-family: "Inter", sans-serif;
        /* text-transform: uppercase; */
        font-weight: 300;
      }

      .mainWrapper {
        display: flex;
        flex-direction: column;
        justify-content: center; 
        align-items: center;
        width: 100%;
        height: 100%;
      }

      .btnWrapper {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        max-width: 30rem;
        flex: 1 1 auto;
        min-height: 0; 
        max-height: 80%;
        position: relative;
        font-size: var(--btnWrapper-size);
      }

      .mainImg{
        flex: 1 1 auto;           /* занимает всё доступное пространство внутри btnWrapper */
  min-height: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: flex-end;
      
    }

    .mainImg img{
      max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;      /* сохраняем пропорции, вписываем в контейнер */
  /* Дополнительные максимумы, чтобы не становилась слишком большой на больших экранах */
   max-width: min(100%, 60rem); 
  max-height: min(100%, 40rem);
    }

     

      .btn {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  padding: 2rem 1rem;     
  margin-top: -6rem;       
  background-color: white;
  border-radius: 2rem;
  text-decoration: none;
  flex-shrink: 0;           
  min-height: 8rem;  
  height: 14rem;      
}

      .btn span {
        display: flex;
        align-items: center;
        font-size: 2.4rem;
        font-family: "Inter", sans-serif;
        cursor: pointer;
        font-weight: 500;
        color: black;
      }

      .btn span svg {
        width: 1.7rem;
        margin-left: 1rem;
      }

      .price {
        font-size: 1.2rem;
        font-weight: 300;
        font-family: "Inter", sans-serif;
        color: #949494;
        text-align: center;
        padding-top: 1rem;
        padding-bottom: 1rem;
        margin-bottom: 2rem;
      }

      .cancelWrapper {
        font-size: 1rem;
      }

      .cancel {
        font-size: 1rem;
        font-weight: 300;
        font-family: "Inter", sans-serif;
        padding: 0.7rem 2rem;
        background-color: #f1efef00;
        border: 0.7px solid #949494;
        color: #949494;
        border-radius: 3px;
        text-decoration: none;
      }

      .footer {
        width: 100%;
        padding-bottom: 1rem;
        font-size: var(--footerWrapper-size);
        font-weight: 300;
        font-family: "Inter", sans-serif;
      }

      .footerWrapper {
        color: #949494;
        text-align: center;
      }
      .footerWrapper span a {
        color: #949494;
        cursor: pointer;
      }


      @media (min-width: 400px) {
        :root {
          --logoMega-size: 11rem;
          --logoText-size: 1.65rem;
        }
      }

      @media (min-width: 400px) and (min-height: 750px){
       
      }

      @media (min-width: 500px) and (max-height: 960px) {
        :root {
          font-size: 14px;
          font-size: clamp(6px, 3.5vmin, 15px); 
        }
      }

      @media (min-width: 500px) and (max-height: 770px) {
        :root {
          font-size: 12px;
          font-size: clamp(6px, 3vmin, 15px); 
        }
      }

      @media (min-width: 500px) and (max-height: 720px) {
        :root {
          font-size: 10px;
          font-size: clamp(6px, 3vmin, 14px); 
        }
      }

      @media (min-width: 640px) {
        :root {
          --logoMega-size: 14rem;
          --logoText-size: 2rem;
        }
        .mainText{
          font-size: 2rem;
        }
        .btnWrapper{
            max-width: 50rem;
        }
      
      }

      @media (min-width: 640px) and (min-height: 960px) {
        :root {
          font-size: 16px;
          font-size: clamp(6px, 4vmin, 16px); 
        }
      
      }

      @media (max-height: 650px) {
       
      }

      @media (max-height: 560px) {
        
        .price {
          margin-bottom: 1rem;
        }
      }

      @media (max-height: 500px) {
        .mainImg {
          flex: 0 1 auto;
          min-height: 20px;
          width: 100%;
          display: flex;
          justify-content: center;
          align-items: flex-end;
        }

        .mainImg img{
          display: none;
        }
        .mainText {
          margin-bottom: 2.5rem;

        }
}

      @media (max-height: 300px) {
        :root {
            font-size: 2.5vh;
            font-size: clamp(1px, 2.5vmin, 10px); 
        }
      }
      @media (max-width: 310px) {
        :root {
            font-size: 2.5vw;
            font-size: clamp(1px, 2.5vmin, 10px); 
        }
      }
    </style>
